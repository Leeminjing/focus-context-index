name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m examples.focus_integration
      - run: python -m benchmarks.run --repeats 1 --segment-sizes 12 --output benchmark-results/ci.json
      - run: python -m benchmarks.contention --repeats 1 --context-counts 1 4 16 --output benchmark-results/contention-ci.json
